<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squad Beachhead</title><style>body{margin:0;background:#080e15;color:#fff;font-family:system-ui}.nav{padding:16px;background:#0c1724;border-bottom:1px solid #38c8ed}.nav a{color:#ffe36e;margin-right:18px;text-decoration:none;font-weight:900}.wrap{max-width:1250px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:1fr 260px;gap:18px}.box{background:#111d2c;border:1px solid #46667d;border-radius:14px;padding:10px}.box canvas{width:100%;display:block;border-radius:9px;background:#829a7e}.side{padding:18px}.bar{height:10px;background:#37212a;margin:6px 0 15px;border-radius:9px;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:#4be18c}.bar.red i{background:#ff5f61}.btn{width:100%;padding:12px;margin-top:12px;border:0;border-radius:8px;background:#e23ca9;color:#fff;font-weight:900}.hint{font:12px monospace;color:#8babbb;line-height:1.5;margin-top:16px}@media(max-width:850px){.layout{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html">Dashboard</a><a href="mission-squad.html">Squad Beachhead</a><a href="badges.html">Badges</a></nav><main class="wrap"><div class="layout"><div class="box"><canvas id="c" width="1100" height="620"></canvas></div><aside class="box side"><h2>Squad Beachhead</h2>TEAM<div class="bar"><i id="t"></i></div>OBJECTIVE<div class="bar red"><i id="o"></i></div><p>Magazine <b id="m">30 / 30</b></p><button class="btn" id="cover">TRENCH COVER [TAB]</button><button class="btn" id="reload">RELOAD [R]</button><p class="hint">WASD/arrows move<br>Mouse aims<br>Click/Space fires<br>Six squad members fire automatically<br>Finite assault wave</p></aside></div></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),W=1100,H=620;let p={x:160,y:490,aim:0,hp:100,cover:false},ammo=30,obj=100,keys={},mouse={x:700,y:350},shots=[],foes=[],enemyShots=[],reloadAt=0,last=0,spawn=0,done=false;c.onmousemove=e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;p.aim=Math.atan2(mouse.y-p.y,mouse.x-p.x)};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Tab'){e.preventDefault();p.cover=!p.cover}if(e.key.toLowerCase()==='r')reload();if(e.code==='Space')fire()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.onclick=fire;document.getElementById('cover').onclick=()=>p.cover=!p.cover;document.getElementById('reload').onclick=reload;function reload(){if(ammo<30&&!reloadAt)reloadAt=performance.now()+800}function fire(){if(ammo<=0||reloadAt)return;ammo--;let a=p.aim;shots.push({x:p.x+Math.cos(a)*35,y:p.y-28+Math.sin(a)*35,vx:Math.cos(a)*14,vy:Math.sin(a)*14})}function addFoes(){for(let i=0;i<10;i++)foes.push({x:850+i*28,y:350+Math.random()*150,hp:2,c:40+Math.random()*100})}function man(q,col){x.fillStyle=col;x.fillRect(q.x-9,q.y-30,18,30);x.fillStyle='#d8a176';x.beginPath();x.arc(q.x,q.y-40,9,0,7);x.fill();x.fillStyle='#16242a';x.fillRect(q.x-10,q.y-50,20,6)}function loop(now){let dt=Math.min(32,now-last);last=now;if(!foes.length&&!done){addFoes();done=true}if(reloadAt&&now>reloadAt){ammo=30;reloadAt=0}let v=4;if(keys.w||keys.arrowup)p.y-=v;if(keys.s||keys.arrowdown)p.y+=v;if(keys.a||keys.arrowleft)p.x-=v;if(keys.d||keys.arrowright)p.x+=v;p.x=Math.max(30,Math.min(580,p.x));p.y=Math.max(180,Math.min(570,p.y));foes.forEach(e=>{e.x-=.25;e.c--;if(e.c<1){let a=Math.atan2(p.y-e.y,p.x-e.x);enemyShots.push({x:e.x,y:e.y-20,vx:Math.cos(a)*5,vy:Math.sin(a)*5});e.c=70+Math.random()*80}});for(let i=0;i<6;i++){let q={x:250+i*40,y:450+i%2*18},e=foes[0];if(e){let a=Math.atan2(e.y-q.y,e.x-q.x);shots.push({x:q.x,y:q.y-25,vx:Math.cos(a)*7,vy:Math.sin(a)*7,ally:1})}}shots.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;foes.forEach((e,j)=>{if(Math.hypot(b.x-e.x,b.y-e.y)<24){e.hp--;shots.splice(i,1);if(e.hp<=0){foes.splice(j,1);obj=Math.max(0,obj-3)}}})});enemyShots.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;if(Math.hypot(b.x-p.x,b.y-p.y)<25){enemyShots.splice(i,1);if(!p.cover)p.hp=Math.max(0,p.hp-7)}});x.fillStyle='#819b80';x.fillRect(0,0,W,H);x.fillStyle='#6f794e';for(let i=0;i<10;i++)x.fillRect(i*150,270+(i%3)*32,100,9);x.fillStyle='#4b3626';x.fillRect(0,520,W,100);x.strokeStyle='#a77d49';for(let y=540;y<620;y+=22){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}x.fillStyle='#593a26';x.fillRect(720,410,240,70);for(let i=0;i<8;i++)x.fillRect(720+i*30,395,26,18);x.fillStyle='#26363b';x.fillRect(835,330,120,80);x.fillStyle='#172125';x.fillRect(875,295,70,36);x.fillStyle='#ffe36e';x.font='bold 15px monospace';x.fillText('OBJECTIVE',840,500);x.fillStyle='#2e7045';x.fillRect(600,300,120,38);x.fillStyle='#17271d';x.fillRect(620,340,22,12);x.fillRect(685,340,22,12);for(let i=0;i<6;i++)man({x:250+i*40,y:475+i%2*18},'#377592');foes.forEach(e=>man(e,'#bd4d54'));x.save();x.translate(p.x,p.y-25);man({x:0,y:25},p.cover?'#358ec3':'#42c797');x.rotate(p.aim);x.fillStyle='#243237';x.fillRect(5,-4,65,8);x.restore();shots.forEach(b=>{x.fillStyle=b.ally?'#f7d367':'#ffe66e';x.fillRect(b.x,b.y,18,4)});enemyShots.forEach(b=>{x.fillStyle='#ff665d';x.fillRect(b.x,b.y,18,4)});if(p.cover){x.fillStyle='#9b7142';x.fillRect(0,480,310,45)}document.getElementById('t').style.width=p.hp+'%';document.getElementById('o').style.width=obj+'%';document.getElementById('m').textContent=reloadAt?'RELOADING':ammo+' / 30';requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
