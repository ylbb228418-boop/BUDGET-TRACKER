<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Land Assault // Squad Mission</title><style>*{box-sizing:border-box}body{margin:0;background:#070d13;color:#fff;font-family:system-ui}.nav{height:60px;padding:0 22px;display:flex;align-items:center;gap:20px;background:#0d1724;border-bottom:1px solid #46cbed}.nav a{color:#ffe36e;text-decoration:none;font-weight:900}.wrap{max-width:1300px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:1fr 270px;gap:18px}.frame,.panel{background:#101c2a;border:1px solid #47657a;border-radius:16px;padding:10px;box-shadow:0 20px 55px #000a}.frame canvas{width:100%;height:auto;display:block;border-radius:10px;background:#8da178}.panel{padding:20px}.panel h1{font-size:20px;margin:0 0 16px}.label{font:800 11px monospace;color:#a4d4e4}.bar{height:10px;background:#3a2027;border-radius:9px;overflow:hidden;margin:5px 0 14px}.bar i{display:block;height:100%;width:100%;background:#4fdf91}.bar.red i{background:#ff5e5e}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #294154;padding:9px 0}.button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:#df3aa6;color:#fff;font-weight:900;cursor:pointer}.hint{font:12px monospace;color:#8aabba;line-height:1.5;margin-top:16px}</style></head><body><nav class="nav"><a href="index.html">Dashboard</a><a href="mission-assault.html">Land Assault</a><a href="mission-omaha.html">Omaha Mission</a><a href="badges.html">Badges</a></nav><main class="wrap"><div class="layout"><section class="frame"><canvas id="cv" width="1100" height="650"></canvas></section><aside class="panel"><h1>LAND ASSAULT HUD</h1><div class="label">TEAM HEALTH</div><div class="bar"><i id="team"></i></div><div class="label">OBJECTIVE BUNKER</div><div class="bar red"><i id="obj"></i></div><div class="stat"><span>Squad</span><b>6 operators</b></div><div class="stat"><span>Magazine</span><b id="ammo">30 / 30</b></div><button class="button" id="cover">TAKE COVER [TAB]</button><button class="button" id="reload">RELOAD [R]</button><p class="hint">WASD / arrows move · mouse aims<br>Click / Space fires · squad fires automatically<br>Land map: vehicles, sandbags, defended bunker.</p></aside></div></main><script>const c=document.getElementById('cv'),g=c.getContext('2d'),W=1100,H=650;let p={x:170,y:495,hp:100,cover:false,aim:0},squad=100,obj=100,ammo=30,reloadAt=0,mouse={x:700,y:350},keys={},bullets=[],enemyBullets=[],allied=[],enemies=[],last=performance.now(),spawn=0; c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;p.aim=Math.atan2(mouse.y-p.y,mouse.x-p.x)});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Tab'){e.preventDefault();p.cover=!p.cover}if(e.key.toLowerCase()==='r')reload();if(e.code==='Space')fire()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);c.addEventListener('click',fire);cover.onclick=()=>p.cover=!p.cover;reload.onclick=reload;function reload(){if(ammo<30&&!reloadAt)reloadAt=performance.now()+900}function fire(){if(reloadAt||ammo<=0)return;ammo--;let a=p.aim;bullets.push({x:p.x+Math.cos(a)*30,y:p.y-25+Math.sin(a)*30,vx:Math.cos(a)*14,vy:Math.sin(a)*14})}function enemy(x,y,type){enemies.push({x,y,type,hp:type==='vehicle'?8:3,cool:70+Math.random()*80})}enemy(850,370,'vehicle');enemy(970,420,'bunker');enemy(760,300,'vehicle');enemy(920,320,'gunner');function man(q,col){g.fillStyle=col;g.fillRect(q.x-9,q.y-30,18,30);g.fillStyle='#d5a176';g.beginPath();g.arc(q.x,q.y-40,9,0,7);g.fill();g.fillStyle='#18242a';g.fillRect(q.x-11,q.y-50,22,6);g.fillRect(q.x-12,q.y,7,18);g.fillRect(q.x+5,q.y,7,18)}function loop(now){let dt=Math.min(32,now-last);last=now;if(reloadAt&&now>reloadAt){ammo=30;reloadAt=0}let v=4;if(keys.w||keys.arrowup)p.y-=v;if(keys.s||keys.arrowdown)p.y+=v;if(keys.a||keys.arrowleft)p.x-=v;if(keys.d||keys.arrowright)p.x+=v;p.x=Math.max(30,Math.min(580,p.x));p.y=Math.max(180,Math.min(570,p.y));if(spawn++>140){spawn=0;for(let i=0;i<2;i++)enemy(700+Math.random()*300,300+Math.random()*200,'infantry')}enemies.forEach(e=>{e.cool--;if(e.cool<1){let a=Math.atan2(p.y-e.y,p.x-e.x);enemyBullets.push({x:e.x,y:e.y-20,vx:Math.cos(a)*5,vy:Math.sin(a)*5});e.cool=e.type==='bunker'?18:80+Math.random()*60}});for(let i=0;i<4;i++){let q={x:260+i*40,y:450+i%2*20};let e=enemies.find(x=>x.x>550);if(e){let a=Math.atan2(e.y-q.y,e.x-q.x);allied.push({x:q.x,y:q.y-20,vx:Math.cos(a)*9,vy:Math.sin(a)*9})}}bullets.concat(allied).forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;enemies.forEach((e,j)=>{if(Math.hypot(b.x-e.x,b.y-e.y)<30){e.hp--;b.x=-100;if(e.hp<=0){enemies.splice(j,1);obj=Math.max(0,obj-2)}}})});enemyBullets.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;if(Math.hypot(b.x-p.x,b.y-p.y)<25){enemyBullets.splice(i,1);if(!p.cover)p.hp=Math.max(0,p.hp-7)}});draw();team.style.width=p.hp+'%';objEl.style.width=obj+'%';ammoEl.textContent=reloadAt?'RELOADING':ammo+' / 30';requestAnimationFrame(loop)}const team=document.getElementById('team'),objEl=document.getElementById('obj'),ammoEl=document.getElementById('ammo');function draw(){g.fillStyle='#8da178';g.fillRect(0,0,W,H);g.fillStyle='#6e744d';for(let i=0;i<10;i++)g.fillRect(i*140,250+(i%3)*32,110,10);g.fillStyle='#403124';g.fillRect(0,530,W,120);g.strokeStyle='#9c7446';for(let y=545;y<640;y+=22){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}g.fillStyle='#493422';g.fillRect(690,400,210,85);for(let i=0;i<8;i++)g.fillRect(690+i*27,385,24,18);g.fillStyle='#263439';g.fillRect(855,340,110,70);g.fillStyle='#10191d';g.fillRect(895,310,55,35);g.fillStyle='#ffe36e';g.font='bold 14px monospace';g.fillText('OBJECTIVE BUNKER',805,500);g.fillStyle='#2e6c42';g.fillRect(680,265,115,38);g.fillRect(755,255,80,25);g.fillStyle='#17261b';g.fillRect(700,303,20,12);g.fillRect(770,303,20,12);enemies.forEach(e=>{if(e.type==='vehicle'){g.fillStyle='#2e6b42';g.fillRect(e.x-45,e.y-25,90,30);g.fillStyle='#16251b';g.fillRect(e.x-20,e.y-38,50,15);g.fillRect(e.x-42,e.y+2,18,9);g.fillRect(e.x+24,e.y+2,18,9)}else{man(e,'#c14951')}});for(let i=0;i<6;i++)man({x:255+i*40,y:475+i%2*18},'#386f86');g.save();g.translate(p.x,p.y-25);man({x:0,y:25},p.cover?'#328fc5':'#44c796');g.rotate(p.aim);g.fillStyle='#253238';g.fillRect(5,-4,58,8);g.fillStyle='#10171a';g.fillRect(50,-2,22,4);g.restore();bullets.concat(allied).forEach(b=>{g.fillStyle='#ffe36e';g.fillRect(b.x,b.y,18,4)});enemyBullets.forEach(b=>{g.fillStyle='#ff665b';g.fillRect(b.x,b.y,18,4)});if(p.cover){g.fillStyle='#9d7242';g.fillRect(0,485,310,52);g.fillStyle='#432b20';for(let i=0;i<8;i++)g.fillRect(i*39,485,28,52)}}loop(performance.now())</script></body></html>
