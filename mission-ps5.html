<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission // Cinematic</title><style>*{box-sizing:border-box}body{margin:0;background:#050810;color:#eaf6ff;font-family:Inter,system-ui,sans-serif}.nav{height:64px;display:flex;align-items:center;gap:24px;padding:0 28px;background:#080d18ee;border-bottom:1px solid #39bfe8;position:sticky;top:0;z-index:5}.nav a{color:#ffe26e;text-decoration:none;font-weight:800}.stage{max-width:1400px;margin:auto;padding:24px}.eyebrow{color:#67ddff;font:800 12px monospace;letter-spacing:3px}.layout{display:grid;grid-template-columns:1fr 290px;gap:20px;margin-top:15px}.frame{position:relative;background:#0c1622;border:1px solid #557187;border-radius:18px;padding:8px;box-shadow:0 20px 60px #000b}.frame canvas{display:block;width:100%;height:auto;border-radius:12px;background:#172c38}.panel{background:linear-gradient(145deg,#111f30,#0b111d);border:1px solid #45647c;border-radius:18px;padding:20px;box-shadow:0 20px 45px #0008}.panel h2{margin-top:0;color:#fff}.meter{height:11px;background:#281d25;border-radius:20px;overflow:hidden;margin:7px 0 16px}.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#39e08a,#b9f36b);transition:.2s}.meter.enemy i{background:linear-gradient(90deg,#ff3d50,#ffa438)}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:10px;background:#e735a8;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 4px #8b1d66}button:active{transform:translateY(3px);box-shadow:0 1px #8b1d66}.status{margin-top:15px;color:#a9d7eb;font-size:13px;line-height:1.5}.keys{margin-top:18px;color:#7898ac;font:12px monospace}@media(max-width:900px){.layout{grid-template-columns:1fr}.nav{gap:12px;padding:0 14px;font-size:12px}}
</style></head><body><nav class="nav"><a href="index.html">Dashboard</a><a href="mission-ps5.html">Cinematic Mission</a><a href="briefing.html">Briefing</a><a href="loadout.html">Loadout</a><a href="badges.html">Badges</a></nav><main class="stage"><div class="eyebrow">LIVE OPERATION // CINEMATIC MODE</div><h1>Operation: Safe Passage</h1><div class="layout"><section class="frame"><canvas id="c" width="1100" height="620"></canvas></section><aside class="panel"><h2>Mission HUD</h2><label>TEAM INTEGRITY</label><div class="meter"><i id="team"></i></div><label>OBJECTIVE CORE</label><div class="meter enemy"><i id="enemy"></i></div><button id="cover">TAKE COVER [TAB]</button><button id="fire">FIRE [SPACE]</button><div class="status" id="status">Move with WASD or arrow keys. Disable the objective core.</div><div class="keys">WASD / ARROWS · TAB COVER · SPACE FIRE</div></aside></div></main><script>const cv=document.getElementById('c'),x=cv.getContext('2d'),W=cv.width,H=cv.height;let p={x:170,y:470,hp:100,cover:false},core=100,keys={},shots=[],sparks=[],t=0;const troops=Array.from({length:18},(_,i)=>({x:90+i*48,y:420+(i%3)*20,phase:i*.4}));addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Tab'){e.preventDefault();p.cover=!p.cover;document.getElementById('cover').textContent=p.cover?'LEAVE COVER [TAB]':'TAKE COVER [TAB]'}if(e.code==='Space')fire()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);document.getElementById('cover').onclick=()=>{p.cover=!p.cover;document.getElementById('cover').textContent=p.cover?'LEAVE COVER [TAB]':'TAKE COVER [TAB]'};document.getElementById('fire').onclick=fire;function fire(){shots.push({x:p.x+25,y:p.y-25,v:11});for(let i=0;i<7;i++)sparks.push({x:p.x+25,y:p.y-25,vx:Math.random()*5,vy:Math.random()*5-2,life:18});core=Math.max(0,core-2)}function drawSoldier(q,col){x.fillStyle=col;x.beginPath();x.arc(q.x,q.y-32,9,0,7);x.fill();x.fillRect(q.x-8,q.y-23,16,28);x.fillRect(q.x-12,q.y+5,7,18);x.fillRect(q.x+5,q.y+5,7,18);x.fillStyle='#101820';x.fillRect(q.x-11,q.y-41,22,7)}function loop(){t++;if(keys.w||keys.arrowup)p.y=Math.max(170,p.y-4);if(keys.s||keys.arrowdown)p.y=Math.min(540,p.y+4);if(keys.a||keys.arrowleft)p.x=Math.max(30,p.x-4);if(keys.d||keys.arrowright)p.x=Math.min(500,p.x+4);x.clearRect(0,0,W,H);let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0d2030');sky.addColorStop(.48,'#325569');sky.addColorStop(.49,'#866e48');sky.addColorStop(1,'#bd9a5b');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#27343b';for(let i=0;i<8;i++){x.fillRect(i*170-((t*.2)%170),278,130,5);x.fillRect(i*170-((t*.2)%170)+35,262,5,22)}x.fillStyle='#4c382b';x.fillRect(0,515,W,105);x.strokeStyle='#a98251';for(let y=530;y<620;y+=23){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}troops.forEach(q=>{q.x+=.35;if(q.x>W+30)q.x=-20;drawSoldier(q,'#5d7780')});x.fillStyle='#1c382b';x.fillRect(880,300,150,125);x.fillStyle='#324c54';x.fillRect(910,260,90,55);x.fillStyle='#111b20';x.fillRect(945,235,55,22);x.fillStyle='#ffbe43';x.fillRect(988,220,5,25);x.fillStyle='#e72547';x.font='bold 16px monospace';x.fillText('OBJECTIVE',885,450);x.fillStyle='#2e6d45';x.fillRect(600,430,100,38);x.fillStyle='#182a20';x.fillRect(625,410,60,24);x.fillRect(690,425,65,7);x.fillStyle='#12191c';x.fillRect(610,468,20,12);x.fillRect(675,468,20,12);troops.slice(0,6).forEach(q=>{q.x+=.3});drawSoldier(p,p.cover?'#39a5d9':'#d64855');if(!p.cover&&t%55===0){p.hp=Math.max(0,p.hp-3);document.getElementById('team').style.width=p.hp+'%'}shots.forEach((s,i)=>{s.x+=s.v;x.fillStyle='#ffe36c';x.shadowBlur=16;x.shadowColor='#ffe36c';x.fillRect(s.x,s.y,22,4);x.shadowBlur=0;if(s.x>W)shots.splice(i,1)});sparks.forEach((s,i)=>{s.x+=s.vx;s.y+=s.vy;s.life--;x.fillStyle='#ffcf58';x.fillRect(s.x,s.y,4,4);if(s.life<1)sparks.splice(i,1)});document.getElementById('enemy').style.width=core+'%';document.getElementById('status').textContent=core?'Reach the core and keep moving.':'Objective disabled — mission complete.';requestAnimationFrame(loop)}loop()</script></body></html>
