<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Mission 2</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2c456c,#0b101b 60%);color:#fff;font-family:system-ui}.nav{padding:16px 24px;background:#121525ee;position:sticky;top:0;z-index:9;border-bottom:2px solid #23d9ff}.nav a{color:#ffe14a;margin-right:18px;text-decoration:none;font-weight:900}.wrap{max-width:1200px;margin:auto;padding:28px}.eyebrow{color:#ffe14a;font:900 12px monospace;letter-spacing:2px}.layout{display:grid;grid-template-columns:1fr 260px;gap:20px}.game{height:560px;position:relative;overflow:hidden;border:4px solid #d8b74e;border-radius:14px;background:linear-gradient(#647f82 0 18%,#b39a61 18%);box-shadow:0 18px 0 #070a10,0 30px 50px #000a}.game:before{content:'MISSION 01  /  TRENCH FRONT';display:block;padding:13px;background:#b30e18;color:#ffe9a2;font:900 18px monospace;letter-spacing:2px}.ground{position:absolute;inset:59px 0 0;background:repeating-linear-gradient(0deg,transparent 0 24px,#8f7549 25px 26px),radial-gradient(#765e39 1px,transparent 1px);background-size:100% 26px,13px 13px}.trench{position:absolute;bottom:15px;width:31%;height:82px;background:repeating-linear-gradient(0deg,#39251c 0 12px,#79522f 12px 20px);border:5px solid #211712;z-index:3}.t1{left:0}.t2{right:0}.tank{position:absolute;bottom:110px;width:80px;height:35px;background:#3c774c;border:4px solid #142118;border-radius:5px;z-index:4;box-shadow:0 13px 0 -4px #182019}.tank:after{content:'';position:absolute;width:52px;height:7px;background:#142118;left:40px;top:-13px;transform:rotate(-8deg)}.ta{left:15%}.tb{right:15%;transform:scaleX(-1)}.soldier{position:absolute;bottom:116px;width:18px;height:58px;background:linear-gradient(#d8a176 0 22%,#365d67 22% 62%,#17262d 62%);border:2px solid #162027;z-index:5;animation:march 4s linear infinite}.s1{left:25%}.s2{left:34%;animation-delay:.4s}.s3{left:43%;animation-delay:.8s}.s4{left:52%;animation-delay:1.2s}.s5{left:61%;animation-delay:1.6s}.s6{left:70%;animation-delay:2s}@keyframes march{to{transform:translateX(230px)}}.panel{background:#141c2de8;border:1px solid #49637f;border-radius:14px;padding:18px;height:max-content;box-shadow:0 10px 25px #0006}.bar{height:10px;background:#45231f;margin:7px 0 14px;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#55d17c}.bar.enemy i{background:#f45c52}.button{width:100%;border:0;border-radius:9px;padding:12px;background:#ff35c8;color:#fff;font-weight:900;cursor:pointer;margin-top:9px}.mini{margin-top:18px;height:100px;border:1px solid #40617c;background:linear-gradient(135deg,#1c5c55,#3a2b32);position:relative}.mini:after{content:'YOU';position:absolute;left:45%;top:45%;color:#ffe14a;font-size:10px}.status{margin-top:14px;color:#9edfff;font-size:13px}@media(max-width:800px){.layout{grid-template-columns:1fr}.game{height:450px}}
</style></head><body><nav class="nav"><a href="index.html">Dashboard</a><a href="mission-v2.html">Mission</a><a href="briefing.html">Briefing</a><a href="loadout.html">Loadout</a><a href="badges.html">Badges</a></nav><main class="wrap"><div class="eyebrow">YOU ARE HERE / SECRET MISSION</div><h1>Operation: Safe Passage</h1><div class="layout"><section class="game"><div class="ground"></div><div class="trench t1"></div><div class="trench t2"></div><div class="tank ta"></div><div class="tank tb"></div><i class="soldier s1"></i><i class="soldier s2"></i><i class="soldier s3"></i><i class="soldier s4"></i><i class="soldier s5"></i><i class="soldier s6"></i></section><aside class="panel"><h2>Mission HUD</h2><label>TEAM HP</label><div class="bar"><i id="team"></i></div><label>ENEMY BUNKER</label><div class="bar enemy"><i id="enemy"></i></div><button class="button" id="cover">TAB: TAKE COVER</button><button class="button" id="fire">FIRE</button><div class="mini"></div><div class="status" id="status">Move with WASD or arrows. Press Space to fire.</div></aside></div></main><script>let hp=100,en=100,safe=false;const team=document.getElementById('team'),enemy=document.getElementById('enemy'),status=document.getElementById('status');function fire(){en=Math.max(0,en-4);enemy.style.width=en+'%';status.textContent=en?'Hit confirmed. Keep moving.':'Mission complete — bunker disabled.'}document.getElementById('fire').onclick=fire;document.getElementById('cover').onclick=()=>{safe=!safe;document.getElementById('cover').textContent=safe?'IN COVER':'TAB: TAKE COVER';status.textContent=safe?'You are protected in the trench.':'You are exposed.'};document.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();document.getElementById('cover').click()}if(e.code==='Space')fire()});setInterval(()=>{if(!safe){hp=Math.max(0,hp-2);team.style.width=hp+'%'}},900)</script></body></html>
