<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omaha Beach // Squad Mission</title><style>*{box-sizing:border-box}body{margin:0;background:#07111b;color:#fff;font-family:system-ui}.nav{height:60px;display:flex;align-items:center;gap:20px;padding:0 22px;background:#0c1725;border-bottom:1px solid #41c9ed}.nav a{color:#ffe26e;text-decoration:none;font-weight:900}.wrap{max-width:1300px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:1fr 270px;gap:18px}.frame,.panel{background:#111e2d;border:1px solid #42627a;border-radius:16px;padding:10px;box-shadow:0 20px 55px #0009}.frame canvas{display:block;width:100%;height:auto;border-radius:10px;background:#6e8a91}.panel{padding:20px}.panel h1{font-size:20px;margin:0 0 18px}.label{font:800 11px monospace;color:#9bcfe2}.bar{height:10px;background:#3d2225;border-radius:10px;overflow:hidden;margin:5px 0 14px}.bar i{display:block;height:100%;width:100%;background:#52de91}.bar.red i{background:#ff5b61}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #294154;padding:9px 0}.button{width:100%;border:0;border-radius:9px;padding:12px;margin-top:12px;background:#df3aa6;color:#fff;font-weight:900;cursor:pointer}.hint{font:12px monospace;line-height:1.5;color:#88aabb;margin-top:17px}.banner{color:#ffe26e;font:900 12px monospace;letter-spacing:2px;margin-bottom:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}.nav{font-size:12px;gap:10px}}
</style></head><body><nav class="nav"><a href="index.html">Dashboard</a><a href="mission-omaha.html">Omaha Mission</a><a href="mission-final.html">Desktop Mission</a><a href="badges.html">Badges</a></nav><main class="wrap"><div class="banner">HISTORICAL ARCADE SCENARIO // BEACHHEAD 01</div><div class="layout"><section class="frame"><canvas id="cv" width="1100" height="650"></canvas></section><aside class="panel"><h1>BEACHHEAD HUD</h1><div class="label">PLAYER HEALTH</div><div class="bar"><i id="hp"></i></div><div class="label">SQUAD HEALTH</div><div class="bar"><i id="squad"></i></div><div class="stat"><span>Wave</span><b id="wave">1 / 4</b></div><div class="stat"><span>Enemies left</span><b id="left">0</b></div><div class="stat"><span>Magazine</span><b id="ammo">30 / 30</b></div><button class="button" id="cover">DIVE INTO TRENCH [TAB]</button><button class="button" id="reload">RELOAD [R]</button><p class="hint">Move: WASD or arrow keys<br>Aim: mouse · Fire: click or Space<br>Your squad fires automatically.<br>Finite waves: clear all 4 to win.</p></aside></div></main><script>const cv=document.getElementById('cv'),g=cv.getContext('2d'),W=1100,H=650;let p={x:180,y:500,hp:100,cover:false,aim:0},squad=100,wave=1,ammo=30,reloadAt=0,enemies=[],shots=[],enemyShots=[],alliedShots=[],sparks=[],score=0,spawned=0,last=performance.now(),mouse={x:700,y:360},keys={};cv.addEventListener('mousemove',e=>{let r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;p.aim=Math.atan2(mouse.y-p.y,mouse.x-p.x)});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Tab'){e.preventDefault();p.cover=!p.cover}if(e.key.toLowerCase()==='r')reload();if(e.code==='Space')fire()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);cv.addEventListener('click',fire);document.getElementById('cover').onclick=()=>p.cover=!p.cover;document.getElementById('reload').onclick=reload;function fire(){if(reloadAt||ammo<=0)return;ammo--;let a=p.aim;shots.push({x:p.x+Math.cos(a)*30,y:p.y-25+Math.sin(a)*30,vx:Math.cos(a)*14,vy:Math.sin(a)*14});for(let i=0;i<5;i++)sparks.push({x:p.x,y:p.y-25,vx:Math.random()*4-2,vy:Math.random()*4-2,life:14})}function reload(){if(ammo<30&&!reloadAt)reloadAt=performance.now()+900}function spawnWave(){let count=5+wave*3;for(let i=0;i<count;i++)enemies.push({x:W+30+i*45,y:350+Math.random()*150,hp:2,cool:60+Math.random()*100});spawned=count}function hit(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}function drawMan(q,col){g.fillStyle=col;g.fillRect(q.x-9,q.y-31,18,30);g.fillStyle='#d6a176';g.beginPath();g.arc(q.x,q.y-41,9,0,7);g.fill();g.fillStyle='#17242c';g.fillRect(q.x-10,q.y-51,20,6);g.fillRect(q.x-12,q.y,7,18);g.fillRect(q.x+5,q.y,7,18)}function loop(now){let dt=Math.min(32,now-last);last=now;if(reloadAt&&now>reloadAt){ammo=30;reloadAt=0}let v=4;if(keys.w||keys.arrowup)p.y-=v;if(keys.s||keys.arrowdown)p.y+=v;if(keys.a||keys.arrowleft)p.x-=v;if(keys.d||keys.arrowright)p.x+=v;p.x=Math.max(30,Math.min(580,p.x));p.y=Math.max(190,Math.min(570,p.y));if(enemies.length===0&&spawned===0)spawnWave();if(enemies.length===0&&spawned>0&&wave<4){wave++;spawned=0}enemies.forEach(e=>{e.x-=.35;e.cool--;if(e.cool<=0){let a=Math.atan2(p.y-e.y,p.x-e.x);enemyShots.push({x:e.x,y:e.y-22,vx:Math.cos(a)*5,vy:Math.sin(a)*5});e.cool=90+Math.random()*100}});for(let i=0;i<2;i++){let q={x:260+i*38,y:470+i*16};if(enemies[0]){let a=Math.atan2(enemies[0].y-q.y,enemies[0].x-q.x);alliedShots.push({x:q.x,y:q.y-28,vx:Math.cos(a)*8,vy:Math.sin(a)*8})}}shots.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;enemies.forEach((e,j)=>{if(hit(b,e,25)){e.hp--;shots.splice(i,1);if(e.hp<=0){enemies.splice(j,1);score+=100}}})});alliedShots.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;enemies.forEach((e,j)=>{if(hit(b,e,25)){e.hp--;alliedShots.splice(i,1);if(e.hp<=0){enemies.splice(j,1);score+=100}}})});enemyShots.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;if(hit(b,p,25)){enemyShots.splice(i,1);if(!p.cover)p.hp=Math.max(0,p.hp-7)}else if(b.x<0)enemyShots.splice(i,1)});if(enemies.length>12)squad=Math.max(0,squad-.15);draw();document.getElementById('hp').style.width=p.hp+'%';document.getElementById('squad').style.width=squad+'%';document.getElementById('wave').textContent=Math.min(wave,4)+' / 4';document.getElementById('left').textContent=enemies.length;document.getElementById('ammo').textContent=reloadAt?'RELOADING':ammo+' / 30';if(wave>=4&&enemies.length===0&&spawned>0){g.fillStyle='#ffe26e';g.font='bold 34px monospace';g.fillText('BEACHHEAD SECURED',355,110)}requestAnimationFrame(loop)}function draw(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#b4d2d7');sky.addColorStop(.43,'#76999d');sky.addColorStop(.44,'#3b7791');sky.addColorStop(.55,'#6e8a53');sky.addColorStop(1,'#a38755');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#55744d';for(let i=0;i<10;i++)g.fillRect(i*140-(performance.now()/20%140),375,80,8);g.fillStyle='#4c3827';g.fillRect(0,525,W,125);g.strokeStyle='#a77d49';for(let y=540;y<640;y+=22){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}g.fillStyle='#3c5355';g.fillRect(900,315,160,110);g.fillStyle='#687578';g.fillRect(930,275,92,58);g.fillStyle='#172126';g.fillRect(966,245,65,28);g.fillStyle='#ffe26e';g.font='bold 15px monospace';g.fillText('BEACHHEAD',900,452);for(let i=0;i<4;i++)drawMan({x:250+i*42,y:500+i%2*15},'#3b6f86');enemies.forEach(e=>drawMan(e,'#b94852'));g.save();g.translate(p.x,p.y-25);drawMan({x:0,y:25},p.cover?'#338fc2':'#44c892');g.rotate(p.aim);g.fillStyle='#263239';g.fillRect(5,-4,52,8);g.fillStyle='#10171b';g.fillRect(48,-2,20,4);g.restore();shots.concat(alliedShots).forEach(b=>{g.fillStyle='#ffe36e';g.fillRect(b.x,b.y,18,4)});enemyShots.forEach(b=>{g.fillStyle='#ff6359';g.fillRect(b.x,b.y,18,4)});sparks.forEach((s,i)=>{s.x+=s.vx;s.y+=s.vy;s.life--;g.fillStyle='#ffe36e';g.fillRect(s.x,s.y,4,4);if(s.life<1)sparks.splice(i,1)});if(p.cover){g.fillStyle='#b77943';g.fillRect(0,480,300,50);g.fillStyle='#432b20';for(let i=0;i<8;i++)g.fillRect(i*38,480,28,50)}}requestAnimationFrame(loop)</script></body></html>
