<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loadout</title><style>body{margin:0;background:#111827;color:#fff;font-family:system-ui}.nav{padding:16px;background:#151126;border-bottom:3px solid #00d9ff}.nav a{color:#ffe14a;margin-right:18px;text-decoration:none;font-weight:900}.wrap{max-width:900px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.item{background:#202e43;border:2px solid #416481;border-radius:15px;padding:20px;min-height:130px}.item.selected{border-color:#ffe14a;box-shadow:0 0 20px #ffe14a55}.item h3{color:#67d8ff}.item button{background:#ff35c8;color:#fff;border:0;border-radius:8px;padding:9px;font-weight:800;cursor:pointer}.status{margin:18px 0;color:#ffe14a;font-weight:800}</style></head><body><nav class="nav"><a href="index.html">Dashboard</a><a href="mission.html">Secret Mission</a><a href="badges.html">Badge Shelf</a><a href="briefing.html">Briefing</a></nav><main class="wrap"><h1>LOADOUT</h1><p>Choose your visual kit before entering the mission.</p><div class="status" id="status">Selected: Scout</div><div class="grid"><article class="item selected"><h3>Scout</h3><p>Fast movement and quick cover.</p><button>SELECT</button></article><article class="item"><h3>Guardian</h3><p>Extra team protection.</p><button>SELECT</button></article><article class="item"><h3>Engineer</h3><p>Repairs the mission meter.</p><button>SELECT</button></article></div></main><script>document.querySelectorAll('.item button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));b.parentElement.classList.add('selected');document.getElementById('status').textContent='Selected: '+b.parentElement.querySelector('h3').textContent})</script></body></html>
