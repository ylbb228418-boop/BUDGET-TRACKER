<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safe Passage // Desktop</title><style>*{box-sizing:border-box}body{margin:0;background:#070c14;color:#eef8ff;font-family:system-ui}.nav{height:60px;display:flex;align-items:center;gap:22px;padding:0 24px;background:#0b1422;border-bottom:1px solid #41c9ed}.nav a{color:#ffe36e;text-decoration:none;font-weight:800}.wrap{max-width:1300px;margin:auto;padding:22px}.layout{display:grid;grid-template-columns:1fr 270px;gap:18px}.frame,.panel{background:#111d2c;border:1px solid #405f75;border-radius:16px;padding:10px;box-shadow:0 20px 55px #0009}.frame canvas{display:block;width:100%;height:auto;border-radius:10px;background:#203b43}.panel{padding:20px}.panel h1{font-size:22px;margin:0 0 18px}.label{font:800 11px monospace;color:#8bc6d9}.bar{height:10px;background:#37212b;border-radius:8px;overflow:hidden;margin:6px 0 15px}.bar i{display:block;height:100%;width:100%;background:#4cdb8a}.bar.red i{background:#ff5e5e}.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #263d50}.button{width:100%;border:0;border-radius:9px;padding:12px;margin-top:12px;background:#e638a6;color:#fff;font-weight:900;cursor:pointer}.hint{font:12px monospace;color:#87a9bb;line-height:1.5;margin-top:18px}</style></head><body><nav class="nav"><a href="index.html">Dashboard</a><a href="mission-final.html">Desktop Mission</a><a href="briefing.html">Briefing</a><a href="loadout.html">Loadout</a><a href="badges.html">Badges</a></nav><main class="wrap"><div class="layout"><section class="frame"><canvas id="cv" width="1100" height="650"></canvas></section><aside class="panel"><h1>MISSION HUD</h1><div class="label">TEAM HEALTH</div><div class="bar"><i id="team"></i></div><div class="label">OBJECTIVE HEALTH</div><div class="bar red"><i id="objective"></i></div><div class="stat"><span>Wave</span><b id="wave">1 / 5</b></div><div class="stat"><span>Score</span><b id="score">0</b></div><div class="stat"><span>Ammo</span><b id="ammo">12 / 12</b></div><button class="button" id="cover">TAKE COVER [TAB]</button><button class="button" id="reload">RELOAD [R]</button><div class="hint">WASD / arrows move<br>Mouse aims the gun<br>Click / Space fires<br>Enemy shots travel back toward you</div></aside></div></main><script>const cv=document.getElementById('cv'),g=cv.getContext('2d'),W=1100,H=650;let p={x:180,y:510,hp:100,cover:false,aim:0},mouse={x:800,y:320},foes=[],bullets=[],enemyBullets=[],sparks=[],keys={},score=0,wave=1,objective=100,ammo=12,reloadAt=0,last=performance.now(),spawnAt=0;cv.addEventListener('mousemove',e=>{let r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height;p.aim=Math.atan2(mouse.y-p.y,mouse.x-p.x)});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Tab'){e.preventDefault();p.cover=!p.cover}if(e.key.toLowerCase()==='r')reload();if(e.code==='Space')fire()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);cv.addEventListener('click',fire);document.getElementById('cover').onclick=()=>p.cover=!p.cover;document.getElementById('reload').onclick=reload;function reload(){if(ammo<12&&!reloadAt)reloadAt=performance.now()+900}function fire(){if(reloadAt||ammo<=0)return;ammo--;let a=p.aim;bullets.push({x:p.x+Math.cos(a)*28,y:p.y-25+Math.sin(a)*28,vx:Math.cos(a)*14,vy:Math.sin(a)*14});for(let i=0;i<5;i++)sparks.push({x:p.x+Math.cos(a)*30,y:p.y-25+Math.sin(a)*30,vx:Math.random()*4-2,vy:Math.random()*4-2,life:14})}function spawn(){foes.push({x:W+30,y:380+Math.random()*140,hp:3,cool:30+Math.random()*100})}function hit(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}function loop(now){let dt=Math.min(32,now-last);last=now;if(reloadAt&&now>reloadAt){ammo=12;reloadAt=0}let speed=4;if(keys.w||keys.arrowup)p.y-=speed;if(keys.s||keys.arrowdown)p.y+=speed;if(keys.a||keys.arrowleft)p.x-=speed;if(keys.d||keys.arrowright)p.x+=speed;p.x=Math.max(35,Math.min(580,p.x));p.y=Math.max(180,Math.min(570,p.y));spawnAt-=dt;if(spawnAt<0){spawn();spawnAt=1100-Math.min(550,wave*80)}foes.forEach(f=>{f.x-=.5;f.cool--;if(f.cool<=0){let a=Math.atan2(p.y-f.y,p.x-f.x);enemyBullets.push({x:f.x,y:f.y-22,vx:Math.cos(a)*6,vy:Math.sin(a)*6});f.cool=80+Math.random()*70}});bullets.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;foes.forEach((f,j)=>{if(hit(b,f,24)){f.hp--;bullets.splice(i,1);if(f.hp<=0){foes.splice(j,1);score+=100;objective=Math.max(0,objective-2)}}})});enemyBullets.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;if(hit(b,p,25)){enemyBullets.splice(i,1);if(!p.cover)p.hp=Math.max(0,p.hp-8)}});if(foes.length>9)objective=Math.max(0,objective-.25);if(score>=wave*600)wave++;draw();document.getElementById('team').style.width=p.hp+'%';document.getElementById('objective').style.width=objective+'%';document.getElementById('score').textContent=score;document.getElementById('wave').textContent=Math.min(wave,5)+' / 5';document.getElementById('ammo').textContent=reloadAt?'RELOADING':ammo+' / 12';requestAnimationFrame(loop)}function draw(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#102a40');sky.addColorStop(.46,'#567c83');sky.addColorStop(.47,'#8e744b');sky.addColorStop(1,'#c09a5c');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#4d3828';g.fillRect(0,525,W,125);g.strokeStyle='#a57d4c';for(let y=540;y<640;y+=22){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}g.fillStyle='#233b32';g.fillRect(895,300,155,130);g.fillStyle='#68797b';g.fillRect(925,265,92,55);g.fillStyle='#182226';g.fillRect(965,240,65,25);g.fillStyle='#ffe36e';g.font='bold 15px monospace';g.fillText('OBJECTIVE CORE',900,455);foes.forEach(f=>{g.fillStyle='#bd4f59';g.fillRect(f.x-10,f.y-28,20,30);g.fillStyle='#d5a176';g.beginPath();g.arc(f.x,f.y-39,9,0,7);g.fill();g.fillStyle='#15222a';g.fillRect(f.x-10,f.y-49,20,6)});g.save();g.translate(p.x,p.y-25);g.fillStyle=p.cover?'#338dc2':'#41c28e';g.fillRect(-11,-25,22,35);g.fillStyle='#d5a176';g.beginPath();g.arc(0,-36,9,0,7);g.fill();g.fillStyle='#17242b';g.fillRect(-11,-46,22,6);g.rotate(p.aim);g.fillStyle='#273238';g.fillRect(5,-4,42,8);g.fillStyle='#10171c';g.fillRect(38,-2,20,4);g.restore();bullets.forEach(b=>{g.fillStyle='#ffe36e';g.shadowBlur=14;g.shadowColor='#ffe36e';g.fillRect(b.x,b.y,22,4);g.shadowBlur=0});enemyBullets.forEach(b=>{g.fillStyle='#ff625a';g.fillRect(b.x,b.y,18,5)});sparks.forEach((s,i)=>{s.x+=s.vx;s.y+=s.vy;s.life--;g.fillStyle='#ffe36e';g.fillRect(s.x,s.y,4,4);if(s.life<1)sparks.splice(i,1)});if(p.cover){g.fillStyle='#a67846';g.fillRect(0,480,300,48);g.fillStyle='#402a20';for(let i=0;i<8;i++)g.fillRect(i*38,480,28,48)}}loop(performance.now())</script></body></html>
